version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: club-abacus-postgres
    restart: always
    environment:
      POSTGRES_USER: abacus_admin
      POSTGRES_PASSWORD: password_secret
      POSTGRES_DB: club_abacus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - abacus-net

volumes:
  pgdata:
    driver: local

networks:
  abacus-net:
    driver: bridge
